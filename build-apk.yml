name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange app files into www/
        run: |
          mkdir -p www/css www/js www/assets
          mv index.html sw.js manifest.json www/
          mv style.css www/css/
          mv app.js assistant.js storage.js www/js/
          mv icon.svg icon-192.png icon-512.png www/assets/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: concierge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
